[package]
name = "draftcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DraftCraft egui front end (Final Draft-style page view, navigator, index cards, reports); swappable: nothing below depends on it (L6)"

[lints]
workspace = true

[dependencies]
draftcraft-geom = { workspace = true }
draftcraft-doc = { workspace = true }
draftcraft-fonts = { workspace = true }
draftcraft-layout = { workspace = true }
draftcraft-engine = { workspace = true }
draftcraft-collab = { workspace = true }
draftcraft-spell = { workspace = true }
draftcraft-control-key = { workspace = true }
# Settings storage shared with the other Craft apps (storytold/craft-libs#22).
craft-settings = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Window screenshots from the control channel are written as PNG.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
serde_json = { workspace = true }
