[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.100"
repository = "https://github.com/hlophlopgaming/draftcraft"

[workspace.dependencies]
# internal
draftcraft-geom = { path = "crates/geom" }
draftcraft-doc = { path = "crates/doc" }
draftcraft-fonts = { path = "crates/fonts" }
draftcraft-fountain = { path = "crates/fountain" }
draftcraft-fdx = { path = "crates/fdx" }
draftcraft-layout = { path = "crates/layout" }
draftcraft-pdf = { path = "crates/pdf" }
draftcraft-spell = { path = "crates/spell" }
draftcraft-collab = { path = "crates/collab" }
draftcraft-import = { path = "crates/import" }
draftcraft-engine = { path = "crates/engine" }
draftcraft-control-key = { path = "crates/control-key" }
draftcraft-mcp = { path = "crates/mcp" }
draftcraft-ui-egui = { path = "crates/ui-egui" }

# Shared Craft-suite libraries (storytold/craft-libs), pinned to a reviewed revision.
# craft-settings: config.toml storage with the suite's folder rules (craft-libs#22).
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "94777dcf7f8962476e96b049d08d22e25b9330c2" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
quick-xml = "0.42"
krilla = "0.8"
getrandom = "0.4"
flate2 = "1"

# ui
# monochrome_emoji_fonts: the symbol fonts egui bundled by default up to 0.36 (arrows, ✕, ▶ …),
# which the interface uses; without them those glyphs would draw as empty boxes.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
rfd = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
