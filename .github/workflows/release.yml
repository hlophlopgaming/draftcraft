name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to upload assets to (optional, e.g. v0.5.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release -p draftcraft -p draftcraft-cli
      - name: Package Windows archive
        shell: pwsh
        run: |
          $stage = "draftcraft-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/draftcraft.exe, target/release/draftcraft-cli.exe $stage
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, NOTICE, ATTRIBUTION.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: draftcraft-windows-${{ matrix.arch }}.zip

  build-macos:
    name: Build macOS (Universal, arm64, x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build arm64 binaries
        run: cargo build --release --target aarch64-apple-darwin -p draftcraft -p draftcraft-cli
      - name: Build x86_64 binaries
        run: cargo build --release --target x86_64-apple-darwin -p draftcraft -p draftcraft-cli
      - name: Create Universal .app bundle and archive
        run: |
          VERSION=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          STAGE="draftcraft-macos-universal"
          APP="${STAGE}/DraftCraft.app"
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources"

          # App icon: docs/images/icon-512.png scaled into an .icns.
          ICONSET="$RUNNER_TEMP/DraftCraft.iconset"
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s docs/images/icon-512.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2)); [ $d -le 512 ] || d=512
            sips -z $d $d docs/images/icon-512.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "${APP}/Contents/Resources/AppIcon.icns"

          lipo -create \
            target/aarch64-apple-darwin/release/draftcraft \
            target/x86_64-apple-darwin/release/draftcraft \
            -output "${APP}/Contents/MacOS/draftcraft"
          chmod +x "${APP}/Contents/MacOS/draftcraft"

          lipo -create \
            target/aarch64-apple-darwin/release/draftcraft-cli \
            target/x86_64-apple-darwin/release/draftcraft-cli \
            -output "${STAGE}/draftcraft-cli"
          chmod +x "${STAGE}/draftcraft-cli"

          cat > "${APP}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>DraftCraft</string>
            <key>CFBundleDisplayName</key>
            <string>DraftCraft</string>
            <key>CFBundleIdentifier</key>
            <string>com.draftcraft.app</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>draftcraft</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          codesign --force --deep --sign - "${APP}"
          codesign --force --sign - "${STAGE}/draftcraft-cli"

          cp README.md LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md "${STAGE}/"
          ditto -c -k --keepParent "${STAGE}" draftcraft-macos-universal.zip

          # Single-architecture builds of the same bundle: smaller downloads.
          for arch in arm64 x86_64; do
            case $arch in arm64) T=aarch64-apple-darwin ;; x86_64) T=x86_64-apple-darwin ;; esac
            S="draftcraft-macos-${arch}"
            mkdir -p "$S"
            cp -R "${APP}" "$S/"
            cp "target/${T}/release/draftcraft" "$S/DraftCraft.app/Contents/MacOS/draftcraft"
            cp "target/${T}/release/draftcraft-cli" "$S/draftcraft-cli"
            codesign --force --deep --sign - "$S/DraftCraft.app"
            codesign --force --sign - "$S/draftcraft-cli"
            cp README.md LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md "$S/"
            ditto -c -k --keepParent "$S" "$S.zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            draftcraft-macos-universal.zip
            draftcraft-macos-arm64.zip
            draftcraft-macos-x86_64.zip

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    # Ubuntu 22.04 (glibc 2.35) so the binaries also run on older distributions.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev libasound2-dev rpm desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: |
          cargo build --release -p draftcraft -p draftcraft-cli
          strip target/release/draftcraft target/release/draftcraft-cli
      - name: Package tar.gz, .deb, .rpm and AppImage
        run: packaging/linux/package.sh ${{ matrix.arch }} target/release dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  build-web:
    name: Build Web (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli
        run: |
          WB_VER=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/"/, "", $3); print $3; exit}' Cargo.lock)
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WB_VER}/wasm-bindgen-${WB_VER}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" "wasm-bindgen-${WB_VER}-x86_64-unknown-linux-musl/wasm-bindgen"
      - name: Build web bundle
        run: |
          cargo xtask web
          cp README.md LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md apps/draftcraft-web/dist/
          cd apps/draftcraft-web/dist
          zip -r ../../../draftcraft-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web-wasm
          path: draftcraft-web.zip

  publish:
    name: Publish Release
    needs: [build-windows, build-macos, build-linux, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          files: dist/*
          draft: false
          prerelease: false
